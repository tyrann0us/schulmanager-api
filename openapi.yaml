    ClassHour:
      type: object
      description: A period in the school day (`main/class-hour`).
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        number:
          type: [string, 'null']
          description: |
            A **string**: schools number periods `1`, `2`, but also `0` or `5a`. Sorting numerically
            needs the leading digits, or `10` lands between `1` and `2`.
        from:
          type: [string, 'null']
