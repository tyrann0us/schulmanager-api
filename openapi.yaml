openapi: 3.1.0
info:
  title: Schulmanager Online API (reconstructed)
  version: 0.1.0
  summary: Unofficial OpenAPI description of the API behind the Schulmanager Online web and mobile client.
  license:
    name: MIT
    identifier: MIT
  description: |
    An **unofficial, reconstructed** description of the HTTP API that the Schulmanager Online web
    client and its Capacitor-based mobile app talk to. The vendor publishes no API documentation and
    has made no promise about any of this. Nothing here is a contract: endpoints, payloads and
    permissions can change without notice.

    ## The shape of the API

    Not a resource-oriented API. There are about thirteen real HTTP endpoints, and almost the whole
    product goes through one of them:

    | Endpoint | Purpose |
    |---|---|
    | `POST /api/calls` | 715+ logical endpoints, batched, dispatched by (`moduleName`, `endpointName`) |
    | `POST /api/models` | the complete server-side ORM schema — **needs no authentication** |
    | `POST /api/backoffice` | the same envelope, the vendor's internal staff API |
    | `POST /api/login`, `/api/get-salt`, … | authentication |
    | `POST /api/upload-file` | client-side-encrypted binary upload |

    Most *reading* a client does never touches a named endpoint at all: `main/poqa` exposes the
    server's Sequelize models directly, scoped to the calling account.

    ## How to read this document

    `POST /api/calls` carries a batch of logical calls addressed by the pair (`moduleName`,
    `endpointName`). This document keeps that transport visible under
    [the gateway operation](#tag/rpc-gateway) and, in addition, gives every documented logical call its
    own readable operation under a synthetic path of the form

    ```
    /api/calls:<moduleName>/<endpointName>
    ```

    Those synthetic paths are **not routes**. They are a documentation device; every one of them
    carries an `x-rpc` object with the real `moduleName` and `endpointName`, and every request is
    actually sent to `POST /api/calls` wrapped in the envelope. On such an operation the request body
    is the `parameters` object and the response body is the `data` value of the matching result.

    **A client generated from this document without understanding `x-rpc` will not work.** See
    `ADR-001-transport.md` in the repository for why it is modelled this way and what the alternative
    was.

    ## Provenance — three levels, deliberately kept apart

    Every operation and most schemas carry an `x-provenance` field with one of:

    | Value | Means | Worth |
    |---|---|---|
    | `vendor-documented` | taken from a public `module.*.html` product page | intent and intended audience — never a payload or an access guarantee |
    | `statically-extracted` | read out of the shipped JavaScript bundle | the endpoint and its parameter *names* exist at some call site; types are unknown |
    | `verified-live` | called against the live server with a real login and the response recorded | the shape is real **for the role that called it** |

    Response schemas exist only where the shape was seen, and they are not prose transcribed into
    YAML: they are derived from the Swift models of a working client, which decode real responses and
    are pinned by fixtures in the repository.s

    ## Coverage, honestly

    A static extraction of the bundle found **715** logical endpoints across 39 namespaces, and that
    is a lower bound. This document describes the subset that is backed by decoded real responses
    (roughly 40 operations): the family-facing surface of a parent/student account, plus
    authentication and file transfer. Everything else is listed, undocumented, in the generated
    [endpoint catalogue](./catalogue.html) — visibly unfinished.

    Most administrative endpoints answer `403` for the account they were probed with, and role checks
    are **per endpoint, not per module**: the `invoicing` namespace refuses 26 of its 27 endpoints to a
    parent and answers the 27th with a bank account, and `classbook` refuses `get-week-overview` while
    answering `get-history-absences-list`. A `403` does not distinguish "your role may not" from "your
    school never bought this module" — only `main/get-active-modules` knows. Do not read an audience
    claim off a tag.

    Two consequences of that:

    * **Teacher, administrator and back-office shapes are absent.** Everything marked `verified-live`
      was collected with a single family account, so a `403` recorded here is a fact about that
      account, not about a role.
    * **The `su` namespace** (98 endpoints, evidently the vendor's own support console) and the other
      namespaces without a public product page are listed and marked internal, never described as a
      customer API.

    ## Rate limiting

    Every response carries `x-ratelimit-limit`, `x-ratelimit-remaining`, `x-ratelimit-reset`. There is
    no `Retry-After`, and a `429` may arrive **as a result status inside an HTTP 200 envelope** — a
    client that only inspects the HTTP status will report it as a decoding failure.
externalDocs:
  description: Vendor product pages (German)
  url: https://www.schulmanager-online.de/
servers:
  - url: https://login.schulmanager-online.de
    description: Production. Institutions are distinguished by account, not by host.
security:
  - bearerAuth: []
    deviceToken: []
tags:
  - name: Authentication
    description: |
      `x-provenance: verified-live` — the salt/PBKDF2/login chain was executed end to end.
      Plain HTTP endpoints outside the RPC gateway.
  - name: RPC gateway
    description: |
      The single real transport. Read this before any of the synthetic per-endpoint operations.
  - name: ORM gateway (poqa)
    description: |
      `main/poqa` exposes the server's Sequelize models directly, and most *reading* a client does
      goes through it. Rows are scoped to the calling account.
  - name: Institution and account
    description: |
      Cross-cutting `main` endpoints: the school, its active modules, the settings map, the notice
      board, support access. The `main` namespace itself is internal plumbing (113 endpoints, no
      public product page) — only the parts with verified shapes are documented here.
  - name: Files
    description: |
      Uploads are **encrypted client-side** before they leave the device, so the stored blob is opaque
      to the server; the AES key travels inside the file descriptor handled over the RPC gateway. See
      the `StoredFile` schema for that descriptor's unusual wire format.
  - name: Calendar feeds
    description: iCal subscription URLs, addressed by a per-user token that can be rotated.
  - name: Messages
    description: |
      Vendor module **Nachrichten** (`messenger`, 27 endpoints). Direct messages with attachments and
      per-thread reply control. A thread is shared; the read state and admin flag are per subscriber.
    externalDocs:
      url: https://www.schulmanager-online.de/module.nachrichten.html
  - name: Letters
    description: |
      Vendor module **Elternbriefe** (`letters`, 17 endpoints). Letters from school to families with
      read confirmation and optional attached surveys.
    externalDocs:
      url: https://www.schulmanager-online.de/module.elternbriefe.html
  - name: Grades
    description: |
      Vendor module **Noten** (`grades`, 19 endpoints). Teachers enter, families read — and whether
      families read at all is a school setting (`grades.gradesAreVisibleForParents`,
      `finalGradesAreVisibleForParents`, `parentVisibilityDelay` in the settings map).
    externalDocs:
      url: https://www.schulmanager-online.de/module.noten.html
  - name: Documents
    description: |
      Vendor module **Dokumente** (`documents`, 7 endpoints). A permissioned folder tree; an entry is
      either an HTML page or an encrypted file.
    externalDocs:
      url: https://www.schulmanager-online.de/module.dokumente.html
  - name: Calendar
    description: |
      Vendor module **Kalender** (`calendar`, 11 endpoints). Events in group-scoped categories.
      Holidays are injected server-side under the synthetic category id `-1`.
    externalDocs:
      url: https://www.schulmanager-online.de/module.kalender.html
  - name: Class register
    description: |
      Vendor module **Digitales Klassenbuch** (`classbook`, 39 endpoints) — teacher-facing. Exactly
      four of them answered a parent account; those four are the only way a family reads its own
      attendance record, because the management module `absences` refuses every endpoint (403) and the
      ORM model `modules/classbook/student-absence` refuses too.
    externalDocs:
      url: https://www.schulmanager-online.de/module.digitales-klassenbuch.html
  - name: Sick notes
    description: |
      Vendor module **Krankmeldung** (`sick`, 3 endpoints). Parents report a child ill; the record
      flows into the school's Fehlzeiten management. A sick note has a start time but **no end
      time** — that is the main difference from an exemption.
    externalDocs:
      url: https://www.schulmanager-online.de/module.krankmeldung.html
  - name: Exemptions
    description: |
      Vendor module **Beurlaubung** (`exemptions`, 2 endpoints). Parents file a leave request, the
      school grants or refuses it. `granted: null` means undecided, not refused.
    externalDocs:
      url: https://www.schulmanager-online.de/module.antrag-auf-beurlaubung.html
  - name: After-school care
    description: |
      Vendor module **Ganztag** (`allday`, 22 endpoints). Care staff get lists, attendance and
      observations; a family gets exactly one thing — sending the carers a note about pick-up or a
      schedule change. Three endpoints answered a parent, six of the others were refused.
    externalDocs:
      url: https://www.schulmanager-online.de/module.ganztag.html
  - name: Notice board
    description: |
      Vendor module **Schwarzes Brett** (`tiles`, 7 endpoints). Every endpoint in that namespace is
      the editor and is staff-only; the readable side is `main/get-tiles`, and there is no ORM route
      (`modules/tiles/tile` answers 404).
    externalDocs:
      url: https://www.schulmanager-online.de/module.schwarzes-brett.html
  - name: Payments
    description: |
      Vendor module **Zahlungen** (`invoicing`, 27 endpoints). Cashless collection with bank-transfer
      matching. 26 endpoints answered `403` for a parent; `get-student-invoice-of-student-for-printing`
      answered `200` and carried the school's bank account. A family's own bills are read through the
      ORM gateway instead.

      **The payment reference (Verwendungszweck) is computed by the client**, appears in no response,
      and a transfer without it cannot be matched to a child:

      ```
      base9(studentPaymentData.number) + "9" + base9(generalInvoice.number)
      ```

      followed by five Damm check digits — one over the number itself, then over the number with 1…4
      zeros appended — grouped in fours, then the student's name and class. Verified against a printed
      payment request: student 243, invoice 8 → `3009 8303 22 Muster, Max 3a`. Base 9 keeps the digit
      `9` free as a separator, so both numbers can be read back out.
    externalDocs:
      url: https://www.schulmanager-online.de/module.geld-einsammeln.html
  - name: Electives
    description: |
      Vendor module **Wahlfächer** (`electives`, 6 endpoints). Students rank wishes, an algorithm
      assigns places. `StudentPriority.number` is **zero-based**: the first choice is `0`.
    externalDocs:
      url: https://www.schulmanager-online.de/module.wahlfaecher.html
  - name: Parent talks
    description: |
      Vendor module **Elterngespräche** (`parenttalks`, 4 endpoints). The namespace-to-product mapping
      here was inferred wrongly twice from endpoint names; the server states it itself via
      `main/get-bookable-modules-for-offer` (`conferences` = Elternsprechtag, `parenttalks` =
      Elterngespräche, `meetings` = Sprechstunden).
    externalDocs:
      url: https://www.schulmanager-online.de/module.elterngespraeche.html
  - name: Timetable
    description: |
      Vendor module **Stundenplan** (`schedules`, 2 endpoints) — both refused a parent account. The
      timetable itself is assembled from ORM reads on `main` (`lesson`, `class-hour`, `course`, `room`,
      `subject`), which the gateway scopes to the account.
    externalDocs:
      url: https://www.schulmanager-online.de/module.vertretungsplan-anzeige.html
paths:
  /api/get-salt:
    post:
      tags: [Authentication]
      operationId: getSalt
      summary: Fetch the per-account salt for password hashing
      description: |
        First half of the login chain. The returned string is the salt for the PBKDF2 derivation the
        client performs before calling `/api/login`: **SHA-512, 99999 iterations, 512 bytes of output,
        lowercase hex** (1024 hex characters). Answers without authentication.
      security: []
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaltRequest'
      responses:
        '200':
          description: The salt, as a bare JSON string.
          content:
            application/json:
              schema:
                type: string
              example: "d0f5c2…"
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/PlainError'
  /api/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with username or e-mail and password
      description: |
        Second half of the login chain. The plaintext password is sent **alongside** the PBKDF2 hash;
        when the client has no `crypto.subtle` it sends `hash: null` and the server falls back to the
        plaintext. Setting `mobileApp: true` is what makes the server issue a long-lived `userDevice`,
        which is how an app avoids asking for the password on every launch.

        The response is one of five mutually exclusive branches — see `LoginResponse`.
      security: []
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            Success, an account picker, or a second-factor challenge — inspect which field is present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Wrong credentials.
        '403':
          description: |
            Refused. `{"untrustedNetwork": true}` when the school restricts logins by network.
          content:
            application/json:
              schema:
                type: object
                properties:
                  untrustedNetwork:
                    type: boolean
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Login error.
  /api/login-with-user-device:
    post:
      tags: [Authentication]
      operationId: loginWithUserDevice
      summary: Exchange a stored device credential for a JWT
      description: |
        How a mobile client stays logged in. The device credential is the `userDevice` object issued by
        `/api/login` when `mobileApp: true` was set.
      security: []
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  $ref: '#/components/schemas/UserDevice'
                reason:
                  type: string
                  description: Free-form; the client sends values such as `switch-user-device`.
      responses:
        '200':
          description: A fresh bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
        '401':
          description: The device was revoked or never existed.
        default:
          $ref: '#/components/responses/PlainError'
  /api/delete-user-device:
    post:
      tags: [Authentication]
      operationId: deleteUserDevice
      summary: Revoke a device credential (this is also the logout call)
      x-provenance: statically-extracted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  $ref: '#/components/schemas/UserDevice'
      responses:
        '200':
          description: Revoked. Subsequent calls with that device receive `x-user-device-doesnt-exist`.
        default:
          $ref: '#/components/responses/PlainError'
        '401':
          description: Unknown or already revoked device.
  /api/login-status:
    post:
      tags: [Authentication]
      operationId: loginStatus
      summary: Report whether the caller is authenticated
      description: |
        Works with and without credentials, which makes it the cheapest way to test a token. With a
        valid token the response also carries the account's role fields.
      security: []
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty object.
      responses:
        '200':
          description: Authentication state, plus the user record when authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isAuthenticated:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/PlainError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/models:
    post:
      tags: [Authentication]
      operationId: getModels
      summary: The complete server-side ORM schema
      description: |
        Returns the product's whole data model — 95 shared `main` models and 43 module namespaces, with
        German labels, Sequelize attribute types and typed associations (~180 KB). **Requires no
        authentication.** It is the authority on which model paths the ORM gateway accepts; note that
        `poqa` addresses models in **kebab-case** (`main/class-hour`), while this document returns class
        names (`ClassHour`).
      security: []
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty object.
      responses:
        '200':
          description: |
            Two top-level keys: `main` (shared models) and `modules` (per namespace). Not modelled
            further here — the shape is a schema description, not application data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  main:
                    type: object
                  modules:
                    type: object
        default:
          $ref: '#/components/responses/PlainError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/calls:
    post:
      tags: [RPC gateway]
      operationId: postCalls
      summary: The batching RPC gateway — every logical endpoint goes through here
      description: |
        One HTTP request carries N logical calls. The client queues calls and flushes them on the next
        macrotask, so unrelated screens share a round trip.

        Facts that no schema can express, and that clients get wrong:

        * **`results` is matched to `requests` positionally.** There is no correlation id.
        * **`bundleVersion` is required but its value is not checked.** Verified: a bogus
          `"deadbeef00"` answers `200`; an empty string answers HTTP `400`. A hash hardcoded in 2026
          still worked after the bundle had been redeployed, so scraping the live hash is unnecessary.
        * **A failed call has no `data` key.** It is `{status, userError: {germanErrorMessage}}`. A
          client that detects the envelope by looking for `data` reports the wrong error.
        * **`429` can be the *result* status inside an HTTP 200.**
        * **`403` means refused, by role or by booking, indistinguishably.** A module the school never
          bought answers exactly like a booked module this account may not use. `main/get-active-modules`
          is the only authority on what is booked.
        * **`404` means the (`moduleName`, `endpointName`) pair is unknown** — a wrong module guess is
          indistinguishable from a typo.
        * **`500` is a parameter error**, not a generic failure: the same endpoint answers `200` with
          its parameters and `500` with `{}`.
      x-provenance: verified-live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcRequestEnvelope'
      responses:
        '200':
          description: |
            One result per request, in order. Inspect each result's `status` — an HTTP 200 says nothing
            about the individual calls.
          headers:
            x-new-bearer-token:
              description: A rotated JWT. Replace the stored token when this is present.
              schema:
                type: string
            x-user-device-doesnt-exist:
              description: The device credential was revoked; the client must log out.
              schema:
                type: string
            x-ratelimit-limit:
              schema:
                type: integer
            x-ratelimit-remaining:
              schema:
                type: integer
            x-ratelimit-reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcResponseEnvelope'
        '400':
          description: Malformed envelope — an empty `bundleVersion` is enough.
        '401':
          description: Missing or expired bearer token.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maintenance. Carries `X-Downtime-Message`.
  /api/backoffice:
    post:
      tags: [RPC gateway]
      operationId: postBackoffice
      summary: Internal staff gateway (not reachable with a school account)
      description: |
        The same envelope minus `bundleVersion` and minus `moduleName`; it serves the vendor's own
        support and contract tooling (the `su` namespace, 98 endpoints). Documented so that nobody
        mistakes it for a customer API. No shape here has been observed.
      x-provenance: statically-extracted
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  items:
                    type: object
                    required: [endpointName]
                    properties:
                      endpointName:
                        type: string
                      parameters:
                        type: object
      responses:
        '200':
          description: Envelope as `/api/calls`. Unobserved.
        '403':
          description: Expected for any non-staff account.
  /api/upload-file:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Upload an encrypted blob
      description: |
        The bytes are **already encrypted by the client**; the server stores an opaque blob. The AES-256
        key is part of the `StoredFile` descriptor that the RPC gateway then carries around, which is
        why the server can serve attachments it cannot read. Sent by `XMLHttpRequest`, not `fetch`.
      x-provenance: statically-extracted
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: File name, as it should appear to readers.
        - name: type
          in: query
          required: true
          schema:
            type: string
          description: MIME type.
        - name: scope
          in: query
          required: true
          schema:
            type: string
          description: Storage scope, e.g. `messenger`, `documents`, `institution`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: |
            The stored-file descriptor to attach to a message, letter or document. Shape unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        default:
          $ref: '#/components/responses/PlainError'
        '401':
          description: Missing or expired bearer token.
  /api/schoolregistration/upload-attachment:
    post:
      tags: [Files]
      operationId: uploadRegistrationAttachment
      summary: Upload an attachment for an online school registration
      description: Same mechanism as `/api/upload-file`, scoped to the registration flow.
      x-provenance: statically-extracted
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Stored-file descriptor. Shape unverified.
        default:
          $ref: '#/components/responses/PlainError'
        '401':
          description: Missing or expired bearer token.
  /download-file/{descriptor}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download an encrypted blob
      description: |
        Served from the host returned by the RPC call `get-remote-storage-url`, **not** from the login
        host — override the server when calling. The path segment is the base64 of the JSON descriptor:
        `btoa(unescape(encodeURIComponent(JSON.stringify(storedFile))))`. The response body is
        ciphertext; decrypt it with the `key` inside the descriptor.
      x-provenance: statically-extracted
      servers:
        - url: '{remoteStorageUrl}'
          description: From `get-remote-storage-url`.
          variables:
            remoteStorageUrl:
              default: https://storage.schulmanager-online.de
      parameters:
        - name: descriptor
          in: path
          required: true
          schema:
            type: string
          description: Base64 of the JSON `StoredFile` array form.
      responses:
        '200':
          description: Encrypted bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown or expired descriptor.
  /ical/calendar/{token}:
    get:
      tags: [Calendar feeds]
      operationId: icalCalendar
      summary: iCal feed of every calendar category
      description: |
        The token is per user and is fetched over the RPC gateway (`calendar/get-ical-token`); passing
        `{renew: true}` there rotates it and invalidates this URL. Exams are deliberately **not**
        subscribable — `calendar/get-events-as-ics` serves those through the gateway instead.
      security: []
      x-provenance: statically-extracted
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: iCalendar document.
          content:
            text/calendar:
              schema:
                type: string
        '404':
          description: Unknown or rotated token.
  /ical/calendar/{token}/{categoryId}:
    get:
      tags: [Calendar feeds]
      operationId: icalCalendarCategory
      summary: iCal feed of one calendar category
      security: []
      x-provenance: statically-extracted
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: categoryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EntityId'
      responses:
        '200':
          description: iCalendar document.
          content:
            text/calendar:
              schema:
                type: string
        '404':
          description: Unknown token or category.
  /ical/schedules/{token}:
    get:
      tags: [Calendar feeds]
      operationId: icalSchedules
      summary: iCal feed of the timetable
      description: Token from `schedules/get-schedules-ical-token`.
      security: []
      x-provenance: statically-extracted
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: iCalendar document.
          content:
            text/calendar:
              schema:
                type: string
        '404':
          description: Unknown or rotated token.
  /webdav-substitutions/{schoolUploadKey}/untis:
    put:
