    Room:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
      additionalProperties: true
    Lesson:
      type: object
      description: |
        One recurring slot (`main/lesson`) — a **pattern, not an occurrence**. `start` and `end` are the
        span the pattern is valid for; each school year adds a new generation of the same slot, so
        filtering on that span is what stops every lesson appearing three times.

        There is no usable teacher here: `Course` has no teacher association (including one answers
        `400`) and `Lesson.teachers` came back empty for every lesson at the school captured. The
        assignment lives in `main/teacher-course-attendance`, which has its own validity window.
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        dayOfWeek:
          type: [integer, 'null']
          description: '**Monday 1 … Friday 5** — not the JavaScript numbering the care module uses.'
        start:
          type: [string, 'null']
          format: date
        end:
          type: [string, 'null']
          format: date
        classHourId:
          anyOf:
            - $ref: '#/components/schemas/EntityId'
            - type: 'null'
        courseId:
          anyOf:
            - $ref: '#/components/schemas/EntityId'
            - type: 'null'
        roomId:
          anyOf:
            - $ref: '#/components/schemas/EntityId'
            - type: 'null'
        classHour:
          oneOf:
            - $ref: '#/components/schemas/ClassHour'
            - type: 'null'
        room:
          oneOf:
            - $ref: '#/components/schemas/Room'
            - type: 'null'
      additionalProperties: true
      x-provenance: verified-live
