components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <jwt>`. The token rotates: when a response carries `x-new-bearer-token`,
        replace the stored one. `X-Skip-Bearer-Token-Renewal: true` suppresses rotation for a call.
    deviceToken:
      type: apiKey
      in: header
      name: X-Token
      description: |
        `{"id":<deviceId>,"key":"<deviceKey>"}` as JSON — the device credential issued by `/api/login`
        with `mobileApp: true`. Sent alongside the bearer token. A revoked device is signalled by the
        response header `x-user-device-doesnt-exist`, which must force a logout.
  responses:
    PlainError:
      description: |
        Non-gateway error. Bodies are inconsistent; `{userError: {germanErrorMessage}}` is the common
        shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserError'
    RateLimited:
      description: |
        Rate limited. No `Retry-After`; the counters are in `x-ratelimit-*`. Could not be provoked
        deliberately (16 concurrent identical reads never dropped `remaining` below 799), so treat it as
        transient and prefer batching over parallel envelopes.
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
        x-ratelimit-reset:
          schema:
            type: integer
    ResultRefused:
      description: |
        **Result status, not an HTTP status** — it arrives inside an HTTP 200 envelope. Refused by role
        **or** because the school has not booked the module; the two are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcResultError'
    ResultUnknownEndpoint:
      description: |
        **Result status, not an HTTP status.** The (`moduleName`, `endpointName`) pair is unknown — a
        wrong module guess looks exactly like a typo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcResultError'
    ResultParameterError:
      description: |
        **Result status, not an HTTP status.** The handler ran and the parameters were wrong or missing.
        Verified: endpoints that answer `200` with their parameters answer `500` with `{}`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcResultError'
  schemas:
    EntityId:
      description: |
        An entity id. **The wire type is inconsistent and the server is strict about it**: messenger ids
        arrive as strings, letters ids as numbers, and re-sending a string id as a number can answer
        `500`. Send back what was received.
      anyOf:
        - type: integer
        - type: string
      examples: [4711, "27155300"]
    EntityRef:
      type: object
      description: |
        An entity passed as an object. Several endpoints require this form —
        `{student: {id}}` — and answer `500` for a flat id.
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
    UserError:
      type: object
      description: |
        The error envelope. Note the field name: the message is German because the product is, and
        there is no locale negotiation.
      properties:
        userError:
          type: object
          properties:
            germanErrorMessage:
              type: string
    StoredFile:
      type: string
      description: |
        A file descriptor. The wire format is a **JSON string containing a seven-element array**, not an
        object:

        ```
        "[123,\"messenger\",\"abc\",\"b64key==\",\"application/pdf\",5678,\"info.pdf\"]"
        ```

        Positionally: `institutionId`, `scope`, `id`, `key`, `type`, `size`, `name`. `key` is the
        base64 AES-256 key needed to decrypt what `/download-file/{descriptor}` returns — the server
        stores ciphertext it cannot read. Element types must be preserved on the way back.
      x-provenance: verified-live
    RpcRequestEnvelope:
      type: object
      required: [bundleVersion, requests]
      properties:
        bundleVersion:
          type: string
          description: |
            Build hash of the JS bundle. **Required, but the value is not validated** — a bogus hash
            answers `200`, an empty string answers HTTP `400`.
          examples: ["0d200d5097"]
        requests:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RpcCall'
      x-provenance: verified-live
    RpcCall:
      type: object
      required: [moduleName, endpointName]
      properties:
        moduleName:
          type: string
          description: |
            Namespace. In the client this is usually implicit and derived from the active UI route,
            which is why the same `endpointName` can be valid under several modules.
        endpointName:
          type: string
        parameters:
          description: |
            Endpoint-specific. Absent for endpoints called with no arguments at all.
          type: object
          additionalProperties: true
    RpcResponseEnvelope:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One entry per request, **matched positionally**. There is no correlation id.
          items:
            $ref: '#/components/schemas/RpcResult'
        systemStatusMessages:
          type: array
          description: Vendor-wide banners (maintenance notices and the like).
          items:
            type: object
            additionalProperties: true
      x-provenance: verified-live
    RpcResult:
      oneOf:
        - $ref: '#/components/schemas/RpcResultSuccess'
        - $ref: '#/components/schemas/RpcResultError'
      description: |
        Success and failure differ structurally: **a failure has no `data` key at all**. Detect the
        outcome from `status`, never from the presence of `data`.
    RpcResultSuccess:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          examples: [200]
        data:
          description: The endpoint's payload. Any JSON value, including null.
    RpcResultError:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          description: |
            `403` refused (role or booking), `404` unknown endpoint pair, `429` rate limited — **inside
            an HTTP 200** — `500` bad or missing parameters.
          examples: [403]
        userError:
          type: object
          properties:
            germanErrorMessage:
              type: string
    PoqaParameters:
      type: object
      required: [action]
      properties:
        action:
          type: object
          required: [model, action]
          properties:
            model:
              type: string
              description: |
                **Kebab-case** model path, case-sensitive: `main/term`, `main/class-hour`,
                `modules/parenttalks/round`. The class names returned by `/api/models` must be converted.
              examples: ["main/lesson"]
            action:
              type: string
              enum: [findAll, findByPk, count]
            instanceId:
              anyOf:
                - $ref: '#/components/schemas/EntityId'
                - type: 'null'
              description: Required for `findByPk`.
            parameters:
              type: array
              description: |
                Sequelize options. The **first element** is the options object; verified keys are
