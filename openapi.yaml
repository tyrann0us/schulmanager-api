  '/api/calls:main/poqa':
    post:
      tags: [ORM gateway (poqa)]
      operationId: mainPoqa
      summary: Query a server-side model directly
      description: |
        Dispatch is not what the name suggests: it is an endpoint **on `main`**. Sending
        `moduleName: "poqa"` answers `404`.

        Rules that were paid for in debugging time:

        * **Model paths are kebab-case and case-sensitive**: `main/term`, `main/class-hour`,
          `modules/parenttalks/round`. `main/Term` answers `404`.
        * **`parameters` is an array** whose first element is the Sequelize options object. Verified
          keys: `where` (with `$in`, `$gte`, `$lte`), `include`, `attributes`, `order`.
        * **`include` defaults to an inner join.** Pass `required: false` unless the join really is a
          filter — 66 lesson rows became 0 because the joined courses belonged to a year the account
          may not read.
        * **`limit` is ignored on some models**, and an unfiltered read can take 5 s where the same
          query with `where: {courseId: {$in: [...]}}` takes 0.2 s. The cost is the per-row permission
          check, so name the ids you want.
        * **Rows are scoped to the account** without any `where` of the caller's own.
        * A model the role may not read answers `403`; a path that does not exist answers `404`.

        Response shape is the model's own, so no single schema applies. The models used by the
        documented parts of this specification are `Lesson`, `ClassHour`, `Course`, `Room`, `Subject`,
        `Term`, `SickNote`, `ExemptionRequest`, `StudentInvoice`, `StudentItem`, `Election`,
        `ParentTalkRound`.
      x-provenance: verified-live
      x-rpc:
        moduleName: main
        endpointName: poqa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoqaParameters'
      responses:
        '200':
          description: |
            A model instance, an array of them, or a count — depending on `action`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoqaResult'
        '403':
          $ref: '#/components/responses/ResultRefused'
        '404':
          $ref: '#/components/responses/ResultUnknownEndpoint'
        '500':
          $ref: '#/components/responses/ResultParameterError'
